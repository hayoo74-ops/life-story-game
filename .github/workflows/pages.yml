name: Verify and deploy LIFE STORY Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: '실제 Pages 배포 실행 (기본값은 검증만)'
        required: true
        default: false
        type: boolean
      approve_public_site:
        description: '게임의 실명과 개인·가족 이야기가 인터넷에 공개되는 배포에 동의합니다'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: life-story-pages
  cancel-in-progress: false

env:
  # Explicit source-publication approval received on 2026-11-04.
  # This does not replace the separate public-site deployment input below.
  PUBLIC_SOURCE_APPROVED: 'true'
  VITE_BASE_PATH: /life-story-game/
  GAME_URL: http://127.0.0.1:4173/life-story-game/

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify approved repository visibility
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          node --input-type=module <<'JS'
          import {assertRepositoryVisibilityAllowed} from './scripts/pages-policy.mjs';
          const raw = process.env.REPOSITORY_PRIVATE;
          assertRepositoryVisibilityAllowed({
            repositoryPrivate: raw === 'true' ? true : raw === 'false' ? false : undefined,
            publicSourceApproved: process.env.PUBLIC_SOURCE_APPROVED === 'true'
          });
          JS
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - name: Check project URL, touch, dialogue, portals, save and offline resources
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/life-story-preview.log 2>&1 &
          npm run test:pages
      - name: Prepare private Pages artifact only for a requested deployment
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    # Pushing main NEVER publishes the autobiographical game.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository and actual site visibility before publishing
        uses: actions/github-script@v7
        env:
          PUBLIC_SITE_APPROVED: ${{ inputs.approve_public_site }}
        with:
          script: |
            const { assertPagesDeploymentAllowed } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pages-policy.mjs`);
            const { data: repository } = await github.rest.repos.get(context.repo);
            // Does not enable Pages. 403/404 intentionally stops publication.
            const { data: site } = await github.rest.repos.getPages(context.repo);
            assertPagesDeploymentAllowed({
              repositoryPrivate: repository.private,
              publicSourceApproved: process.env.PUBLIC_SOURCE_APPROVED === 'true',
              sitePublic: site.public,
              publicApproved: process.env.PUBLIC_SITE_APPROVED === 'true'
            });
      - uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Deploy approved site
        id: deployment
        uses: actions/deploy-pages@v4
